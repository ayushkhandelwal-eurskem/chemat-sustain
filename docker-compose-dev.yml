services:
  db:
    image: postgres:14
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev  # Use development Dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONPATH: /app
      PROTOCOL_FILE_DIR: /app/protocol_files
      # Pinned explicitly (matching PROTOCOL_FILE_DIR) rather than relying on
      # env_file alone: `docker restart` never re-reads env_file, so a container
      # created before the .env value was added silently keeps the config.py
      # default (/data/tenants) and every tenant file listing comes back empty.
      TENANT_DATA_ROOT: /app/data
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app  # Mount source code
      - /app/__pycache__  # Exclude cache
      - ./backend/protocol_files:/app/protocol_files  # Uploaded SOP files (dev)
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - protocol_files/
        - action: rebuild
          path: ./backend/requirements.txt
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev  # Use development Dockerfile
    container_name: frontend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - .next/
            - node_modules/
            - .git/
        - action: rebuild
          path: ./frontend/package.json
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
      - ./certs/origin.pem:/etc/ssl/certs/origin.pem:ro
      - ./certs/origin.key:/etc/ssl/private/origin.key:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

  # --- Identity provider (dev only) -----------------------------------------
  # Keycloak gets its own dedicated Postgres instance, isolated from the
  # application database - identity data and application data should never
  # share a database. This block is dev-only; production Keycloak deployment
  # (its own TLS, its own hardened Postgres, `start` not `start-dev`) is a
  # separate, later deployment decision and is intentionally not added to
  # docker-compose.yml.
  keycloak-db:
    image: postgres:14
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Hostname v2 form (full URL). Plain http + localhost is dev-only.
      KC_HOSTNAME: http://localhost:8082
      KC_HTTP_ENABLED: "true"
    ports:
      - "8082:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - app-network

volumes:
  pgdata:
  keycloak_pgdata:

networks:
  app-network:
    driver: bridge