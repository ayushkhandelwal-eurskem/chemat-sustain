services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # use a long random value, NOT ayush123
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "127.0.0.1:5432:5432"   # ONLY for local development. Remove in production.    
    # NO ports: section. The db is reachable by other containers over
    # app-network. It must never be exposed to the host or internet.
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    environment:
      - PROTOCOL_FILE_DIR=/app/protocol_files
      # Pinned explicitly so the value survives container recreation even if
      # the env_file line is missed; must stay in sync with the bind mount.
      - TENANT_DATA_ROOT=/app/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app-network
    volumes:
      - /home/chematsustain/protocol_files:/app/protocol_files
      # Uploaded research files (.xlsx). WITHOUT this mount /app/data lives in
      # the container's writable layer, so every `docker compose up --build`
      # destroys it - which had already happened: 327 test records referenced a
      # file_path while only 24 files remained on disk.
      # See docs/security/deployment-readiness.md.
      - /home/chematsustain/research_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    # NO host port mapping. nginx proxies to it internally.
    deploy:
      resources:
        limits:
          memory: 2G

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/certs/origin.pem:/etc/ssl/certs/origin.pem:ro
      - /etc/ssl/private/origin.key:/etc/ssl/private/origin.key:ro
    networks:
      - app-network
volumes:
  pgdata:

networks:
  app-network:
    driver: bridge