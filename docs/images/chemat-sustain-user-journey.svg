<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">How information moves through CheMatSustain</title>
  <desc id="desc">A laboratory spreadsheet is checked and organized, stored securely, reviewed for publication, and then shown to approved users through reports or approved machine access.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#64748b"/></marker>
    <style>.title{font:700 31px Arial,sans-serif;fill:#10264b}.sub{font:400 16px Arial,sans-serif;fill:#526078}.num{font:700 20px Arial,sans-serif;fill:#fff}.h{font:700 20px Arial,sans-serif;fill:#10264b}.hw{font:700 20px Arial,sans-serif;fill:#fff}.t{font:400 14px Arial,sans-serif;fill:#42526b}.tw{font:400 14px Arial,sans-serif;fill:#eaf4ff}.small{font:700 12px Arial,sans-serif;fill:#1d4ed8;letter-spacing:1px}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="title">How information moves through CheMatSustain</text>
  <text x="60" y="90" class="sub">The platform preserves the original research file, organizes the results, and shows only approved information.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="235" height="210" rx="20" fill="#fff" stroke="#bfdbfe"/>
    <circle cx="98" cy="190" r="22" fill="#2563eb"/><text x="98" y="197" text-anchor="middle" class="num">1</text>
    <path d="M95 235h78l25 25v66H95zM173 235v27h25" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M112 278h66M112 296h66M112 314h45" stroke="#2563eb" stroke-width="3"/>
    <text x="85" y="395" class="h">Laboratory upload</text><text x="85" y="420" class="t">A project administrator uploads</text><text x="85" y="441" class="t">the scientific spreadsheet.</text>

    <rect x="335" y="150" width="235" height="210" rx="20" fill="url(#blue)"/>
    <circle cx="373" cy="190" r="22" fill="#60a5fa"/><text x="373" y="197" text-anchor="middle" class="num">2</text>
    <path d="M389 248l25-16 25 16v27c0 20-12 35-25 42-13-7-25-22-25-42z" fill="#bfdbfe" stroke="#fff" stroke-width="3"/><path d="M401 274l9 9 18-22" fill="none" stroke="#1e3a8a" stroke-width="4"/>
    <text x="360" y="395" class="hw">Check and organize</text><text x="360" y="420" class="tw">The platform checks the file and</text><text x="360" y="441" class="tw">organizes it into clear sections.</text>

    <rect x="610" y="150" width="235" height="210" rx="20" fill="#fff" stroke="#a7f3d0"/>
    <circle cx="648" cy="190" r="22" fill="#059669"/><text x="648" y="197" text-anchor="middle" class="num">3</text>
    <ellipse cx="720" cy="247" rx="39" ry="15" fill="#d1fae5" stroke="#059669" stroke-width="3"/><path d="M681 247v62c0 20 78 20 78 0v-62M681 278c0 20 78 20 78 0" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
    <text x="635" y="395" class="h">Protected storage</text><text x="635" y="420" class="t">The original file and organized</text><text x="635" y="441" class="t">record are kept securely.</text>

    <rect x="885" y="150" width="235" height="210" rx="20" fill="#fff" stroke="#fbbf24"/>
    <circle cx="923" cy="190" r="22" fill="#d97706"/><text x="923" y="197" text-anchor="middle" class="num">4</text>
    <path d="M975 243h69v76h-69z" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><path d="M990 264h39M990 282h39M990 300h24" stroke="#d97706" stroke-width="3"/><circle cx="1041" cy="313" r="23" fill="#fff" stroke="#d97706" stroke-width="3"/><path d="M1030 313l8 8 16-19" fill="none" stroke="#059669" stroke-width="4"/>
    <text x="910" y="395" class="h">Publication choice</text><text x="910" y="420" class="t">An administrator chooses which</text><text x="910" y="441" class="t">parts, if any, become public.</text>

    <rect x="1160" y="150" width="180" height="210" rx="20" fill="url(#green)"/>
    <circle cx="1198" cy="190" r="22" fill="#6ee7b7"/><text x="1198" y="197" text-anchor="middle" class="num">5</text>
    <circle cx="1248" cy="258" r="24" fill="#d1fae5"/><path d="M1238 260a10 10 0 1 1 20 0M1229 299c3-16 35-16 38 0" fill="none" stroke="#047857" stroke-width="4"/>
    <text x="1185" y="395" class="hw">Approved access</text><text x="1185" y="420" class="tw">People see reports;</text><text x="1185" y="441" class="tw">approved systems use</text><text x="1185" y="462" class="tw">controlled data access.</text>
  </g>
  <path d="M295 255h40" class="line"/><path d="M570 255h40" class="line"/><path d="M845 255h40" class="line"/><path d="M1120 255h40" class="line"/>
  <rect x="60" y="520" width="1280" height="120" rx="20" fill="#10264b"/>
  <text x="90" y="557" class="small" fill="#93c5fd">THE IMPORTANT PRINCIPLE</text>
  <text x="90" y="590" class="hw">Being listed publicly does not mean every result is public.</text>
  <text x="90" y="618" class="tw">Test conditions, raw measurements, processed data, final results, and statistics can each be shared—or kept private—separately.</text>
  <text x="1325" y="685" text-anchor="end" class="sub">CheMatSustain · Plain-language guide</text>
</svg>