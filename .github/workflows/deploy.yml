name: Deploy to IONOS

# Triggered by "Security checks" COMPLETING on main, not directly by the push.
#
# The previous version ran on every push to main regardless of whether the
# security workflow passed, so a push that failed secret scanning, tenant
# isolation or container scanning still deployed. The brief requires production
# deployment to be blocked when those fail, with no warning-only mode, so the
# gate has to be a real dependency rather than a parallel job.
#
# workflow_run is used because the checks live in a separate workflow file;
# `needs:` only works between jobs in the same workflow.
on:
  workflow_run:
    workflows: ["Security checks"]
    types: [completed]
    branches: [main]
  # Manual escape hatch for the case where the site is down and a fix must go
  # out without waiting for the full check suite. Using it is a deliberate,
  # attributable act that appears in the Actions log.
  workflow_dispatch:

concurrency:
  group: chematsustain-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Total job cap. Kept above the SSH command_timeout below so that a slow
    # deploy is reported by the script's own error handler, which dumps service
    # state and logs, rather than being killed by the runner with no diagnostics.
    timeout-minutes: 40
    # Skip when the security run failed, was cancelled, or was skipped.
    # workflow_dispatch has no workflow_run payload, hence the second clause.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Report what triggered this deploy
        run: |
          echo "event:      ${{ github.event_name }}"
          echo "security:   ${{ github.event.workflow_run.conclusion || 'bypassed via workflow_dispatch' }}"
          echo "commit:     ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          # `set -euo pipefail` needs bash; root's login shell on this host is
          # /bin/bash (verified), so pipefail is available. Under dash it would
          # abort with "set: Illegal option -o pipefail".
          script: |
            set -euo pipefail
            cd /home/chematsustain

            # Refuse to deploy over uncommitted local edits rather than
            # discarding them. The working tree on this host HAS been edited
            # directly in the past (nginx/default.conf and docker-compose.yml
            # were changed in place during incident response), so a bare
            # `git merge --ff-only` fails here with a message that does not
            # explain what to do, and `reset --hard` would silently destroy
            # whatever those edits were.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: the working tree at /home/chematsustain has uncommitted changes:" >&2
              git status --porcelain --untracked-files=no >&2
              echo "" >&2
              echo "Deploy stopped without changing anything. Reconcile once, by hand:" >&2
              echo "  git -C /home/chematsustain diff            # confirm nothing is needed" >&2
              echo "  git -C /home/chematsustain checkout --      # discard, ONLY if confirmed" >&2
              echo "Then re-run this workflow." >&2
              exit 1
            fi

            git fetch --quiet origin main
            git merge --ff-only origin/main

            # TEMPORARY production-audit access key. The matching private key
            # exists only on the operator workstation under /tmp. Install the
            # public half idempotently with root-only permissions; a follow-up
            # audited commit removes this bootstrap block, and the key itself is
            # removed from authorized_keys as the final audit action.
            audit_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINx6EUO40mRbcRoUOXcXMsPnDekWMK14I/hoUrwBikhQ chemat-audit-2026-08-27'
            umask 077
            mkdir -p /root/.ssh
            touch /root/.ssh/authorized_keys
            chmod 700 /root/.ssh
            chmod 600 /root/.ssh/authorized_keys
            grep -Fqx "$audit_key" /root/.ssh/authorized_keys \
              || printf '%s\n' "$audit_key" >> /root/.ssh/authorized_keys

            bash scripts/deploy.sh
