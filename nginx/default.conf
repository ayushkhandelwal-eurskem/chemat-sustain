# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name database.eurskem.com auth.eurskem.com;

    return 301 https://$host$request_uri;
}

# Main HTTPS server for non-www
server {
    listen 443 ssl;
    server_name database.eurskem.com;

    ssl_certificate /etc/ssl/certs/origin.pem;
    ssl_certificate_key /etc/ssl/private/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Docker's embedded DNS. Upstreams below go through variables so nginx
    # re-resolves them at request time instead of caching the container IP at
    # startup.
    #
    # This is not theoretical: `docker compose up --build` gives the frontend and
    # backend containers NEW IPs, while nginx - which is not itself recreated -
    # keeps proxying to the old, now-dead addresses. That took the site down with
    # a 502 on 2026-08-03 even though the frontend container was healthy and
    # reachable by name. Previously the only remedy was remembering to recreate
    # nginx after every deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Keycloak (identity provider). Requires:
#  - A DNS record for auth.eurskem.com pointed at this server (not done here -
#    no DNS/IONOS access from this environment).
#  - origin.pem/origin.key must cover auth.eurskem.com. If they're a
#    single-domain cert for database.eurskem.com rather than a wildcard for
#    *.eurskem.com, a separate certificate must be issued for this subdomain
#    before this block will actually serve valid HTTPS.
server {
    listen 443 ssl;
    server_name auth.eurskem.com;

    ssl_certificate /etc/ssl/certs/origin.pem;
    ssl_certificate_key /etc/ssl/private/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location / {
        # Resolved at request time, not config-load time.
        #
        # With a literal `proxy_pass http://keycloak:8080`, nginx resolves the
        # upstream name when it loads the config and REFUSES TO START if it
        # cannot - so a Keycloak container that failed to come up would take
        # the whole site (database.eurskem.com included) down with it. Going
        # through a variable defers resolution, so a Keycloak outage can only
        # 502 this subdomain. 127.0.0.11 is Docker's embedded DNS.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $keycloak_upstream http://keycloak:8080;
        proxy_pass $keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
