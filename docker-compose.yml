services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}   # use a long random value, NOT ayush123
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "127.0.0.1:5432:5432"   # ONLY for local development. Remove in production.    
    # NO ports: section. The db is reachable by other containers over
    # app-network. It must never be exposed to the host or internet.
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    # NO host port mapping. nginx proxies to it internally.
    deploy:
      resources:
        limits:
          memory: 2G

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"     # ONLY nginx faces the internet
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge