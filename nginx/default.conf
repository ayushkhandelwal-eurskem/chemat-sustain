# Authentication throttling is keyed by both the TCP peer and Cloudflare's
# original-client header. That avoids grouping all users behind one edge IP,
# while direct-origin callers still have their source address in the key.
limit_req_zone "$binary_remote_addr:$http_cf_connecting_ip" zone=auth_login:10m rate=5r/m;
limit_req_zone "$binary_remote_addr:$http_cf_connecting_ip" zone=auth_otp:10m rate=10r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name database.eurskem.com;

    return 301 https://$host$request_uri;
}

# Retired identity hostname. Keep an explicit tombstone so it can never fall
# through to the first/default virtual host and accidentally serve the portal.
server {
    listen 80;
    listen 443 ssl;
    server_name auth.eurskem.com;

    ssl_certificate /etc/ssl/certs/origin.pem;
    ssl_certificate_key /etc/ssl/private/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 410;
}

# Main HTTPS server for non-www
server {
    listen 443 ssl;
    server_name database.eurskem.com;

    ssl_certificate /etc/ssl/certs/origin.pem;
    ssl_certificate_key /etc/ssl/private/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Security response headers. Verified absent from production on 2026-08-03:
    # none of the six were being sent on any response.
    #
    # `always` is required - without it nginx omits these on 4xx/5xx, which are
    # exactly the responses an attacker is most likely to be probing.
    #
    # NGINX GOTCHA: add_header does not merge across levels. If any location
    # block below ever gains its own add_header, it stops inheriting ALL of
    # these and must repeat them. No location sets one today.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # HSTS without includeSubDomains or preload, deliberately.
    #
    # includeSubDomains would apply to every *.eurskem.com host, including any
    # that does not yet terminate valid TLS, and browsers would then refuse to
    # connect to them for a year with no client-side override. preload is worse:
    # it is committed into browser binaries and is slow and awkward to undo.
    # Widen this only after every subdomain is confirmed HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Content-Security-Policy is REPORT-ONLY for now, on purpose.
    #
    # The frontend is Next.js, which injects inline hydration scripts and
    # styles. An enforcing policy that is even slightly wrong does not fail
    # loudly - it silently blocks scripts and yields a blank or half-broken
    # page, and this config has already caused two production outages when
    # changed without path-specific testing. Report-only collects the same
    # violation data with no user-visible risk.
    #
    # To enforce: watch the reports, tighten script-src (ideally to a nonce),
    # then rename this header to Content-Security-Policy. Do not skip the
    # observation period.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/users/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users/verify-otp {
        limit_req zone=auth_otp burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/users/verify-otp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/users/(forgot-password|reset-password)$ {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
