name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (fail on medium+ severity/confidence)
        run: |
          bandit -r backend --severity-level medium --confidence-level medium \
            -x backend/parsers \
            -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Enforce no high-severity findings
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("bandit-report.json") as f:
              data = json.load(f)
          high = [r for r in data.get("results", []) if r["issue_severity"] == "HIGH"]
          for r in high:
              print(f"HIGH: {r['filename']}:{r['line_number']} {r['test_id']} {r['issue_text']}")
          if high:
              print(f"\n{len(high)} high-severity bandit finding(s) - failing build.")
              sys.exit(1)
          EOF

  python-dependency-scan:
    name: Python dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies (fail on known vulnerabilities)
        # Exceptions below are reviewed and justified in
        # docs/security/dependency-exceptions.md - do not add an ID here
        # without a corresponding entry there.
        run: |
          pip-audit -r backend/requirements.txt --desc \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  frontend-dependency-scan:
    name: Frontend dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (fail on high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend + frontend)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -t chemat-sustain-${{ matrix.image }}:ci ./${{ matrix.image }}

      - name: Scan image with Trivy
        # Pinned to a commit SHA (not a mutable tag) for v0.36.0 - trivy-action
        # has a prior supply-chain-attack history, so tag-pinning alone isn't
        # sufficient here. Verify against https://github.com/aquasecurity/trivy-action/releases
        # before bumping.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chemat-sustain-${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
