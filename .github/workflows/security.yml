name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (fail on medium+ severity/confidence)
        run: |
          bandit -r backend --severity-level medium --confidence-level medium \
            -x backend/parsers \
            -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Enforce no high-severity findings
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("bandit-report.json") as f:
              data = json.load(f)
          high = [r for r in data.get("results", []) if r["issue_severity"] == "HIGH"]
          for r in high:
              print(f"HIGH: {r['filename']}:{r['line_number']} {r['test_id']} {r['issue_text']}")
          if high:
              print(f"\n{len(high)} high-severity bandit finding(s) - failing build.")
              sys.exit(1)
          EOF

  python-dependency-scan:
    name: Python dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend dependencies (fail on known vulnerabilities)
        # Exceptions below are reviewed and justified in
        # docs/security/dependency-exceptions.md - do not add an ID here
        # without a corresponding entry there.
        run: |
          pip-audit -r backend/requirements.txt --desc \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

  frontend-dependency-scan:
    name: Frontend dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (fail on high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  tenant-isolation:
    name: Tenant isolation / RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway-not-a-real-secret
          POSTGRES_DB: chematsustain_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-throwaway-not-a-real-secret
      PGDATABASE: chematsustain_ci
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create the pre-existing application schema
        # The tenant migrations extend tables that today are created by
        # SQLAlchemy's create_all at runtime. Recreate the minimum shape here so
        # the migrations and their tests can run without booting the whole app.
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TYPE role AS ENUM ('admin','user');
          CREATE TABLE users (
              id SERIAL PRIMARY KEY, email TEXT UNIQUE, password TEXT,
              role role DEFAULT 'user', last_activity TIMESTAMPTZ,
              otp_secret TEXT, is_active BOOLEAN DEFAULT TRUE);
          CREATE TABLE sessions (
              id SERIAL PRIMARY KEY, session_id TEXT UNIQUE NOT NULL,
              user_id INTEGER REFERENCES users(id), created_at TIMESTAMPTZ DEFAULT now(),
              expires_at TIMESTAMPTZ, is_active BOOLEAN DEFAULT TRUE,
              user_agent TEXT, ip_address TEXT);
          CREATE TABLE tests (
              id SERIAL PRIMARY KEY, work_package_name TEXT, element_cms_id TEXT,
              test_name TEXT, test_details JSON, raw_data JSON, processed_data JSON,
              final_results JSON, statistical_analysis JSON,
              is_public BOOLEAN DEFAULT FALSE,
              release_test_details BOOLEAN DEFAULT FALSE,
              release_raw_data BOOLEAN DEFAULT FALSE,
              release_processed_data BOOLEAN DEFAULT FALSE,
              release_final_results BOOLEAN DEFAULT FALSE,
              release_statistical_analysis BOOLEAN DEFAULT FALSE,
              test_result BOOLEAN DEFAULT FALSE, file_path TEXT,
              created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
              updated_at TIMESTAMPTZ NOT NULL DEFAULT now());
          CREATE TABLE categories (
              id SERIAL PRIMARY KEY, name TEXT NOT NULL, sort_order INTEGER DEFAULT 0);
          CREATE TABLE protocols (
              id SERIAL PRIMARY KEY,
              category_id INTEGER REFERENCES categories(id) ON DELETE CASCADE,
              name TEXT NOT NULL, description TEXT, sort_order INTEGER DEFAULT 0,
              file_path TEXT, file_name TEXT, file_mime TEXT, file_size INTEGER);
          CREATE TABLE protocol_tests (
              id SERIAL PRIMARY KEY,
              protocol_id INTEGER REFERENCES protocols(id) ON DELETE CASCADE,
              work_package_name TEXT NOT NULL, element_cms_id TEXT NOT NULL,
              test_name TEXT NOT NULL, display_name TEXT, sort_order INTEGER DEFAULT 0);
          SQL

      - name: Apply tenant migrations
        run: |
          for f in backend/migrations/0*.sql; do
            echo "--- applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Seed a two-tenant fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO organisations (id, slug, name) VALUES
            (gen_random_uuid()::text, 'ulodz', 'University of Lodz'),
            (gen_random_uuid()::text, 'tul',   'Lodz University of Technology')
          ON CONFLICT (slug) DO NOTHING;
          INSERT INTO tests (work_package_name, test_name, organisation_id)
          SELECT 'WP2', 'ci-ulodz-' || g, (SELECT id FROM organisations WHERE slug='ulodz')
          FROM generate_series(1,3) g;
          INSERT INTO tests (work_package_name, test_name, organisation_id)
          SELECT 'WP2', 'ci-tul-' || g, (SELECT id FROM organisations WHERE slug='tul')
          FROM generate_series(1,2) g;
          INSERT INTO categories (name) VALUES
            ('Human Toxicity'), ('Physico-Chemical Characteristics'), ('Uncategorized');
          SQL

      - name: Set application role password
        run: psql -v ON_ERROR_STOP=1 -c "ALTER ROLE chemat_app WITH PASSWORD 'ci-throwaway-app-role';"

      - name: Cross-tenant isolation tests (as non-superuser chemat_app)
        # Runs as chemat_app deliberately: as a superuser every assertion would
        # pass vacuously, because superusers bypass RLS.
        env:
          PGUSER: chemat_app
          PGPASSWORD: ci-throwaway-app-role
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/sql/test_tenant_isolation.sql

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (backend + frontend)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }} image
        run: docker build -t chemat-sustain-${{ matrix.image }}:ci ./${{ matrix.image }}

      - name: Scan image with Trivy
        # Pinned to a commit SHA (not a mutable tag) for v0.36.0 - trivy-action
        # has a prior supply-chain-attack history, so tag-pinning alone isn't
        # sufficient here. Verify against https://github.com/aquasecurity/trivy-action/releases
        # before bumping.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chemat-sustain-${{ matrix.image }}:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
